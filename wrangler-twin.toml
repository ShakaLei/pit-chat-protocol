# Shaka twin chat hub — twin-chat-fix.
# Deploy only with a Workers-edit token. Never secret put, never rotate AGENT_KEY.
#
# Target: existing worker `shaka-chat`
#   hosts: chat.shakaleikaumaka.com
#          shaka-chat.shakaverse.workers.dev
#
# Secrets (wrangler secret put, never commit):
#   AGENT_KEY   already live — do not rotate unless asked
#   REPLY_TOKEN optional, if Groka should use a key other than AGENT_KEY
#
# MIGRATIONS: omitted on purpose. The live worker already has a Hub Durable Object
# (idFromName "hub-v1"). Adding new_classes / new_sqlite_classes can fail or wipe history.

name = "shaka-chat"
main = "worker-twin.js"
compatibility_date = "2026-08-01"
workers_dev = true

[[durable_objects.bindings]]
name = "HUB"
class_name = "Hub"

[observability]
enabled = true
